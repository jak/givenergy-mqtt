on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npm publish --provenance --access public
        if: ${{ steps.release.outputs.release_created }}

      - name: Add install links to release notes
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
        run: |
          BODY=$(gh release view "$TAG" --json body -q .body)
          FOOTER=$(cat <<EOF

          ---

          ### Install

          **npm:**
          \`\`\`bash
          npx givenergy-mqtt@${VERSION}
          \`\`\`
          [View on npm](https://www.npmjs.com/package/givenergy-mqtt/v/${VERSION})

          **Docker:**
          \`\`\`bash
          docker pull ghcr.io/jak/givenergy-mqtt:${VERSION}
          \`\`\`
          [View on GitHub Packages](https://github.com/jak/givenergy-mqtt/pkgs/container/givenergy-mqtt)
          EOF
          )
          gh release edit "$TAG" --notes "${BODY}${FOOTER}"
